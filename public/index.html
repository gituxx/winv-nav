<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>winv.cc</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23cdeedd'/><text x='16' y='22' font-size='16' font-weight='700' font-family='system-ui' fill='%232f7a5b' text-anchor='middle'>W</text></svg>">
<style>
:root{--bg:#fbfaf7;--fg:#2d2f33;--mut:#8d9097;--card:#fff;--line:#efede8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.w{max-width:960px;margin:0 auto;padding:64px 24px 40px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.logo{width:44px;height:44px;border-radius:14px;background:#cdeedd;color:#2f7a5b;display:grid;place-items:center;font-weight:700;font-size:20px}
h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.3px}
.sub{color:var(--mut);margin:0 0 8px 58px}
h2{font-size:14px;font-weight:600;color:var(--mut);margin:40px 2px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
a.c{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:inherit;transition:transform .2s,box-shadow .2s}
a.c:hover{transform:translateY(-3px);box-shadow:0 10px 24px -14px rgba(60,60,40,.35)}
.ic{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--b);color:var(--f)}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tx{min-width:0}.tx b{display:block;font-size:15px;font-weight:600}
.tx span{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer{margin-top:56px;color:var(--mut);font-size:13px;text-align:center}
footer a{color:inherit}
@media(prefers-color-scheme:dark){:root{--bg:#18191b;--fg:#e7e7e5;--mut:#8b8d92;--card:#212225;--line:#2c2d31}.ic{filter:saturate(.8) brightness(.9)}}
@media(max-width:520px){.w{padding-top:44px}.grid{grid-template-columns:1fr 1fr}a.c{flex-direction:column;align-items:flex-start;gap:10px}}
</style></head><body><div class="w">
<div class="top"><div class="logo">W</div><h1>winv.cc</h1></div>
<p class="sub">平时折腾的一些小东西</p>
<div id="m"></div>
<footer>托管于 Cloudflare · <a href="https://github.com/gituxx/winv-nav">源码</a></footer>
</div>
<script>
const I={
tv:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="m8 3 4 4 4-4"/>',
film:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4M3 12h18"/>',
pop:'<path d="M5 9h14l-1.5 12h-11z"/><path d="M8 9a2.5 2.5 0 0 1 4-3 2.5 2.5 0 0 1 4 3M10 9l.5 12M14 9l-.5 12"/>',
play:'<circle cx="12" cy="12" r="9"/><path d="m10 8.5 5 3.5-5 3.5z"/>',
music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
radio:'<path d="M4.9 19.1a10 10 0 0 1 0-14.2M19.1 4.9a10 10 0 0 1 0 14.2M7.8 16.2a6 6 0 0 1 0-8.4M16.2 7.8a6 6 0 0 1 0 8.4"/><circle cx="12" cy="12" r="2"/>',
globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
book:'<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>',
check:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M8.5 13.5l2.5 2.5 4.5-5"/>'};
const C=[["#e3f1fb","#3a7fb3"],["#fde8e1","#c4623f"],["#fff3d6","#b08419"],["#ece7fb","#6e58b8"],["#dff4ea","#2f8a62"],["#e4eefb","#4a6fc1"],["#ddf3f3","#2b8a8a"],["#fbe6ef","#b8507b"],["#eaf4dc","#5b8a2b"]];
const D=[
["影音",[
["tv","LibreTV","TVBox 订阅、换源测速","libretv"],
["film","KVideo","每日更新订阅","kvideo"],
["pop","OuonnkiTV","跟随上游自动更新","ouonnkitv"],
["play","视映","在线视频","shiying"],
["music","Any Listen","听歌","music"],
["radio","TVBox API","订阅源，去重聚合","tvbox"]]],
["工具",[
["globe","NodeScope","节点聚合面板","node"],
["book","Book","看书","book"],
["check","Checkin","WorkBuddy 多账号签到","checkin"]]]];
let k=0;
document.getElementById('m').innerHTML=D.map(([t,l])=>`<h2>${t}</h2><div class=grid>${l.map(([i,n,d,u])=>{const[b,f]=C[k++%C.length];return`<a class=c href="https://${u}.winv.cc/" target=_blank rel=noopener><div class=ic style="--b:${b};--f:${f}"><svg viewBox="0 0 24 24">${I[i]}</svg></div><div class=tx><b>${n}</b><span>${d}</span></div></a>`}).join('')}</div>`).join('');
</script></body></html>
