<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>winv.cc</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23222'/><text x='16' y='22' font-size='17' font-family='Georgia,serif' fill='%23fff' text-anchor='middle'>W</text></svg>">
<style>
:root{--bg:#f6f4ef;--fg:#1f1f1d;--mut:#8a867d;--line:#e2ded4;--hov:#ecE8df;--ac:#b4532a}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--fg:#e8e6e1;--mut:#86837c;--line:#2b2a27;--hov:#1f1e1c;--ac:#e08a5f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.w{max-width:680px;margin:0 auto;padding:72px 24px 48px}
h1{font:600 28px/1.2 Georgia,"Songti SC","STSong",serif;margin:0 0 8px;letter-spacing:.5px}
.sub{color:var(--mut);margin:0 0 40px}
h2{font-size:13px;font-weight:500;color:var(--mut);margin:36px 0 6px;letter-spacing:1px}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li a{display:flex;align-items:baseline;gap:16px;padding:13px 8px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;transition:background .15s}
li a:hover{background:var(--hov)}
li a:hover .n{color:var(--ac)}
.n{font-weight:600;min-width:120px;transition:color .15s}
.d{color:var(--mut);flex:1;font-size:14px}
.u{color:var(--mut);font:12px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap}
footer{margin-top:56px;color:var(--mut);font-size:13px}
footer a{color:inherit}
@media(max-width:560px){.w{padding-top:48px}li a{flex-wrap:wrap;gap:2px 12px}.n{min-width:0}.d{flex-basis:100%;order:3}}
</style></head><body><div class="w">
<h1>winv.cc</h1>
<p class="sub">平时折腾的一些小东西，随便看看。</p>
<div id="m"></div>
<footer>托管于 Cloudflare · <a href="https://github.com/gituxx/winv-nav">源码</a></footer>
</div>
<script>
const D=[
["影音",[
["LibreTV","看片，支持 TVBox 订阅和换源测速","libretv.winv.cc"],
["KVideo","另一个看片站，每日更新订阅","kvideo.winv.cc"],
["OuonnkiTV","影视站，跟随上游自动更新","ouonnkitv.winv.cc"],
["视映","在线视频","shiying.winv.cc"],
["Any Listen","听歌","music.winv.cc"],
["TVBox API","TVBox 订阅源，去重聚合","tvbox.winv.cc"]]],
["工具",[
["NodeScope","节点聚合面板","node.winv.cc"],
["Book","看书","book.winv.cc"],
["Checkin","WorkBuddy 多账号签到","checkin.winv.cc"]]]];
document.getElementById('m').innerHTML=D.map(([t,l])=>`<h2>${t}</h2><ul>${l.map(([n,d,u])=>`<li><a href="https://${u}/" target="_blank" rel="noopener"><span class=n>${n}</span><span class=d>${d}</span><span class=u>${u.replace('.winv.cc','')}</span></a></li>`).join('')}</ul>`).join('');
</script></body></html>
