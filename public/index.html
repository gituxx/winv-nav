<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WinV 导航 · 我的 AI 小项目</title>
<meta name="theme-color" content="#0b0b1a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<style>
:root{--bg:#0b0b1a;--fg:#f1f5f9;--mut:#a5b4cf;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:Inter,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;animation:f 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:520px;height:520px;background:#7c3aed;top:-140px;left:-120px}
.bg i:nth-child(2){width:460px;height:460px;background:#0ea5e9;top:30%;right:-140px;animation-delay:-6s}
.bg i:nth-child(3){width:420px;height:420px;background:#ec4899;bottom:-160px;left:30%;animation-delay:-12s}
@keyframes f{to{transform:translate(80px,60px) scale(1.15)}}
.bg:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:22px 22px}
header{text-align:center;padding:72px 20px 24px}
.time{font-size:clamp(3rem,9vw,5.2rem);font-weight:200;letter-spacing:2px;line-height:1;background:linear-gradient(120deg,#fff,#c4b5fd 50%,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.hi{color:var(--mut);margin:12px 0 28px;font-size:1.02rem}
.hi b{color:var(--fg);font-weight:600}
.search{position:relative;width:min(600px,92%);margin:auto}
.search input{width:100%;padding:16px 56px 16px 52px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.08);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--fg);font-size:1rem;outline:none;transition:.25s}
.search input:focus{border-color:#a78bfa;box-shadow:0 0 0 4px rgba(167,139,250,.2)}
.search input::placeholder{color:var(--mut)}
.search svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);opacity:.6}
.search kbd{position:absolute;right:18px;top:50%;transform:translateY(-50%);font:12px ui-monospace,monospace;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
main{max-width:1120px;margin:auto;padding:12px 20px 40px}
h2{display:flex;align-items:center;gap:10px;font-size:.95rem;font-weight:600;color:var(--mut);letter-spacing:1px;margin:36px 4px 14px}
h2:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
a.c{position:relative;display:flex;gap:14px;align-items:center;padding:18px;border-radius:18px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);text-decoration:none;color:inherit;transition:transform .25s,border-color .25s,background .25s,box-shadow .25s;opacity:0;animation:in .5s forwards}
a.c:hover{transform:translateY(-4px);background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);box-shadow:0 12px 32px -12px var(--g1)}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ic{flex:none;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:1.55rem;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 6px 18px -6px var(--g1)}
.tx{min-width:0}.tx b{display:block;font-size:1.02rem;margin-bottom:4px}
.tx span{display:block;color:var(--mut);font-size:.85rem;line-height:1.45;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.go{position:absolute;right:14px;top:14px;opacity:0;transition:.25s;color:var(--mut)}
a.c:hover .go{opacity:1;transform:translate(2px,-2px)}
.empty{text-align:center;color:var(--mut);padding:40px}
footer{text-align:center;color:var(--mut);padding:24px 20px 40px;font-size:.82rem}
footer a{color:#c4b5fd;text-decoration:none}
@media(max-width:560px){header{padding-top:48px}.grid{grid-template-columns:1fr}}
</style></head><body>
<div class="bg"><i></i><i></i><i></i></div>
<header>
<div class="time" id="t">00:00</div>
<p class="hi" id="hi"></p>
<div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
<input id="q" placeholder="搜索项目，回车直接打开…" autocomplete="off"><kbd>/</kbd></div>
</header>
<main id="m"></main>
<footer>© <span id="y"></span> winv.cc · Powered by Cloudflare · <a href="https://github.com/gituxx/winv-nav" target="_blank">源码</a></footer>
<script>
const D=[
["🎬 影音娱乐",[
["📺","LibreTV","免密码观看、TVBox 订阅、豆瓣推荐、换源测速","https://libretv.winv.cc/","#8b5cf6","#ec4899"],
["🎞️","KVideo","基于每日 TVBox 订阅的视频站","https://kvideo.winv.cc/","#f97316","#ef4444"],
["🍿","OuonnkiTV","与上游同步的自动部署影视站","https://ouonnkitv.winv.cc/","#eab308","#f97316"],
["🎥","视映 Video","在线视频站","https://shiying.winv.cc/","#06b6d4","#3b82f6"],
["🎵","Any Listen","在线音乐播放","https://music.winv.cc/","#10b981","#06b6d4"],
["📡","TVBox API","去重聚合的 TVBox 订阅源备份","https://tvbox.winv.cc/","#6366f1","#8b5cf6"]]],
["🛠️ 实用工具",[
["🌐","NodeScope","开源节点聚合仪表盘","https://node.winv.cc/","#0ea5e9","#22d3ee"],
["📚","Book","书籍 / 阅读站","https://book.winv.cc/","#f43f5e","#fb923c"],
["✅","WorkBuddy Checkin","多账号签到面板（Workers + D1）","https://checkin.winv.cc/","#22c55e","#84cc16"]]]];
const $=s=>document.getElementById(s),m=$('m'),q=$('q');
function r(k=''){k=k.trim().toLowerCase();let n=0;
m.innerHTML=D.map(([t,l])=>{l=l.filter(x=>(x[1]+x[2]+x[3]).toLowerCase().includes(k));return l.length?`<h2>${t}</h2><div class=grid>${l.map(([i,nm,d,u,a,b])=>`<a class=c style="--g1:${a};--g2:${b};animation-delay:${(n++)*40}ms" href="${u}" target=_blank rel=noopener><div class=ic>${i}</div><div class=tx><b>${nm}</b><span>${d}</span></div><svg class=go width=16 height=16 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2><path d="M7 17 17 7M8 7h9v9"/></svg></a>`).join('')}</div>`:''}).join('')||'<p class=empty>没有找到相关项目 🤔</p>'}
q.oninput=()=>r(q.value);
q.onkeydown=e=>{if(e.key==='Enter'){const a=m.querySelector('a.c');a&&window.open(a.href,'_blank')}if(e.key==='Escape'){q.value='';r();q.blur()}};
addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}});
function tick(){const d=new Date(),h=d.getHours();$('t').textContent=d.toTimeString().slice(0,5);
$('hi').innerHTML=`${h<6?'夜深了':h<11?'早上好':h<14?'中午好':h<18?'下午好':'晚上好'}，欢迎来到 <b>WinV</b> · ${d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}`}
tick();setInterval(tick,10000);r();$('y').textContent=new Date().getFullYear();
</script></body></html>
